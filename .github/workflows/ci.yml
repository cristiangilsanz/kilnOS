name: Kiln OS CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest

      - name: Run test suite
        run: |
          python -m pytest tests/ -v

      - name: Verify Kiln Doctor health
        run: |
          python scripts/kiln doctor

      - name: Enforce Token Governor budgets
        run: |
          python scripts/kiln lint-tokens

      - name: Verify adapter drift
        run: |
          python scripts/kiln build-adapters

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Verify npx runner executable
        run: |
          node bin/kiln.js --help
