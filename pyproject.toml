[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "kiln-os"
version = "0.1.0"
description = "A resilient, token-minimizing operating system for AI coding agents"
authors = [{ name = "Kiln OS Core Team" }]
readme = "AGENTS.md"
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
